<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/><title>Radial Defence — Merge Hook</title><style>:root {
        --rd-color-background: #8fab73;
        --rd-color-floor: #8d8f96;
        --rd-color-primary: #ffc043;
        --rd-color-secondary: #8ef2a8;
        --rd-color-cta: #ff5a4a;
        --rd-color-cta-text: #ffffff;
        --rd-color-text-primary: #ffffff;
        --rd-color-text-secondary: #dfe4ea;
        --rd-font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        --rd-weight-heavy: 800;
        --rd-weight-regular: 600;
      }
      html, body {
        margin: 0; padding: 0; overflow: hidden;
        background: var(--rd-color-background);
        touch-action: none; user-select: none; -webkit-user-select: none;
        font-family: var(--rd-font-family);
      }
      #canvas-root { position: fixed; inset: 0; }
      #canvas-root canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed; inset: 0; z-index: 4;
        pointer-events: none;
        padding: max(env(safe-area-inset-top, 0px), 10px) 12px 0;
        transition: opacity 260ms;
      }
      #hud.hidden, #health.hidden { opacity: 0; }
      #health { transition: opacity 260ms; }

      .pill {
        display: inline-flex; align-items: center; gap: 7px;
        background: rgba(22, 26, 32, 0.72);
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 4px 13px 4px 5px;
        box-shadow: 0 3px 9px rgba(0, 0, 0, 0.26);
        color: var(--rd-color-text-primary);
        font-weight: var(--rd-weight-heavy);
        font-size: clamp(14px, 4vw, 19px);
        line-height: 1;
      }
      .pill .dot {
        width: 22px; height: 22px; border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #ffe082, #e8a91d);
        box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.28);
      }
      .pill.pop { animation: pillPop 0.18s ease-out; }
      @keyframes pillPop {
        0% { transform: scale(1); } 45% { transform: scale(1.13); } 100% { transform: scale(1); }
      }

      #topbar { display: flex; justify-content: space-between; align-items: flex-start; }

      #wave {
        color: var(--rd-color-text-primary);
        font-weight: var(--rd-weight-heavy);
        font-size: clamp(13px, 3.6vw, 17px);
        letter-spacing: 1px;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
        padding-top: 6px;
      }

      #health {
        position: fixed;
        left: 50%; transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
        width: min(56vw, 260px); height: 12px;
        background: rgba(18, 20, 26, 0.62);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px; overflow: hidden;
      }
      #health-fill {
        height: 100%; width: 100%;
        background: linear-gradient(90deg, #7ce88a, #35c96b);
        transition: width 180ms ease-out;
      }

      #merge {
        position: fixed;
        left: 50%; transform: translateX(-50%) scale(0.8);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
        pointer-events: auto;
        background: var(--rd-color-primary);
        color: #2a2010;
        border: none; border-radius: 999px;
        padding: clamp(11px, 2.8vw, 16px) clamp(30px, 9vw, 60px);
        font-family: var(--rd-font-family);
        font-weight: var(--rd-weight-heavy);
        font-size: clamp(15px, 4.2vw, 21px);
        letter-spacing: 1.5px;
        box-shadow: 0 6px 0 #c98d22, 0 10px 22px rgba(0, 0, 0, 0.3);
        opacity: 0; visibility: hidden;
        transition: opacity 180ms, transform 180ms;
      }
      #merge.visible {
        opacity: 1; visibility: visible;
        transform: translateX(-50%) scale(1);
        animation: mergeBreathe 1.3s ease-in-out infinite;
      }
      #merge:active { transform: translateX(-50%) scale(0.95); box-shadow: 0 3px 0 #c98d22; }
      @keyframes mergeBreathe {
        0%, 100% { box-shadow: 0 6px 0 #c98d22, 0 10px 22px rgba(0,0,0,0.3); }
        50% { box-shadow: 0 6px 0 #c98d22, 0 10px 30px rgba(255, 192, 67, 0.55); }
      }

      #hand {
        position: fixed;
        left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
        width: 30px; height: 30px; margin-left: -15px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        border: 3px solid rgba(0, 0, 0, 0.75);
        opacity: 0; visibility: hidden;
        pointer-events: none; z-index: 6;
      }
      #hand.visible { opacity: 1; visibility: visible; animation: handTap 1.15s ease-in-out infinite; }
      @keyframes handTap {
        0%, 100% { transform: scale(0.9) translateY(0); opacity: 0.65; }
        50% { transform: scale(1.2) translateY(-8px); opacity: 1; }
      }

      #banner {
        position: fixed; left: 50%; top: 26%;
        transform: translate(-50%, -50%) scale(0.85);
        color: var(--rd-color-secondary);
        font-weight: var(--rd-weight-heavy);
        font-size: clamp(24px, 8vw, 44px);
        letter-spacing: 1px;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35), 0 6px 18px rgba(0, 0, 0, 0.4);
        opacity: 0; pointer-events: none;
        transition: opacity 200ms, transform 200ms;
        white-space: nowrap;
      }
      #banner.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

      #endcard {
        position: fixed; inset: 0; z-index: 20;
        display: none; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: rgba(12, 14, 20, 0.78);
        backdrop-filter: blur(3px);
      }
      #endcard.visible { display: flex; animation: fadeIn 260ms ease-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      #endcard-title {
        color: var(--rd-color-text-primary);
        font-weight: var(--rd-weight-heavy);
        font-size: clamp(26px, 9vw, 48px);
        letter-spacing: 1px;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      #endcard-score {
        color: var(--rd-color-text-secondary);
        font-weight: var(--rd-weight-regular);
        font-size: clamp(15px, 5vw, 22px);
      }

      .rd-cta {
        position: static;
        margin-top: 18px;
        background: var(--rd-color-cta);
        color: var(--rd-color-cta-text);
        border: none; border-radius: 999px;
        padding: clamp(13px, 3.2vw, 19px) clamp(32px, 10vw, 64px);
        font-family: var(--rd-font-family);
        font-weight: var(--rd-weight-heavy);
        font-size: clamp(17px, 4.6vw, 23px);
        box-shadow: 0 7px 0 #b83527, 0 12px 26px rgba(0, 0, 0, 0.4);
        cursor: pointer; display: none;
        animation: ctaPulse 1.4s ease-in-out infinite;
      }
      .rd-cta.visible { display: block; }
      @keyframes ctaPulse {
        0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); }
      }</style><meta name="HandheldFriendly" content="True"><meta http-equiv="cleartype" content="on"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta http-equiv="X-UA-Compatible" content="IE=10"><script defer="defer">(()=>{"use strict";var t={};function e(e,n,i,r){let s=t[e];s||(s=t[e]=[]),s.push(n,i||null,r||!1)}function n(e,n,i){const r=t[e];if(r)if(n){const s=[];for(let t=0;t<r.length;t+=3)(r[t]!==n||void 0!==i&&r[t+1]!==i)&&s.push(r[t],r[t+1],r[t+2]);0===s.length?delete t[e]:t[e]=s}else delete t[e]}function i(e,i,r,s){const a=t[e];if(!a||0===a.length)return;const o=arguments.length,l=a.length;let h,c;for(let t=0;t<l;t+=3)h=a[t],c=a[t+1],a[t+2]&&n(e,h,c),o<=1?h.call(c):2==o?h.call(c,i):3==o?h.call(c,i,r):h.call(c,i,r,s)}var r=0;r++,r++,r++,r++,r++,r++,r++,r++,r++,r++,r++;var s="",a=!1,o=!1,l=!1,h=!1,c=1,u=()=>{};function d(){b.isReady||(i("boot"),document.body.oncontextmenu=function(){return!1},u(b.maxWidth,b.maxHeight),i("ready"),b.isReady=!0)}function p(t){i("volume",t)}function f(t){b.volume=t,p(t)}function m(){f(0),b.isPaused=!0,i("pause")}function g(){l||(f(c),b.isPaused=!1,i("resume"))}function v(t,e){b.maxWidth=Math.floor(t||window.innerWidth),b.maxHeight=Math.floor(e||window.innerHeight),b.isLandscape=b.maxWidth>b.maxHeight,i("resize",b.maxWidth,b.maxHeight)}var _=!1,x=!1;function y(t){"undefined"!=typeof TouchEvent&&t instanceof TouchEvent&&(_=!0),_&&t instanceof MouseEvent||(b.interactions+=1,i("interaction",b.interactions))}function M(){s=/android/i.test(navigator.userAgent)?"https://play.google.com/store/apps/details?id=com.radialdefence.game":"https://apps.apple.com/app/id0000000000",function(){function t(){"visible"===document.visibilityState&&d()}o||(document.addEventListener("visibilitychange",()=>{"visible"===document.visibilityState?(g(),b.isReady||"complete"!==document.readyState||d()):m()}),"complete"===document.readyState?t():window.addEventListener("load",t),window.addEventListe
